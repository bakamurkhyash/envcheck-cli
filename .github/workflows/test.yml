name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Sanity check - CLI runs
        run: envcheck --help

      - name: Run against fixture (expect missing var -> exit 1)
        run: |
          cd tests/fixture
          if envcheck .; then
            echo "Expected exit code 1 (missing var found) but got 0"
            exit 1
          else
            echo "Correctly detected missing env var"
          fi
