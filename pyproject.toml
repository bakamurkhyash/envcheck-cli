[project]
name = "cli-envcheck"
version = "0.1.0"
description = "Scan your codebase for env vars and diff against .env.example"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
envcheck = "envcheck.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["envcheck*"]
